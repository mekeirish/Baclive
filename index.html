<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cours en Direct - Sécurisé</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Jitsi Meet External API -->
  <script src="https://framatalk.org/external_api.js"></script>

  <style>
    #jitsi-container iframe {
      border: 0;
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 1rem;
    }
  </style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b6cb7">
<link rel="apple-touch-icon" href="icon.png"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- En-tête -->
  <header class="p-4 border-b border-slate-800/80 flex justify-between items-center bg-slate-900/50 backdrop-blur z-10">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-slate-600" id="status-indicator"></span>
      <h1 class="font-bold text-base tracking-wide" id="status-text">Salle d'attente</h1>
    </div>
    <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">
      Canal Privé
    </span>
  </header>

  <!-- Zone Principale -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 relative w-full">
    
    <div id="jitsi-container" class="relative w-full max-w-4xl h-[600px] bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl flex flex-col items-center justify-center overflow-hidden">
      
      <!-- Écran d'accueil avant connexion -->
      <div id="welcome-screen" class="text-center p-6 space-y-6 w-full max-w-sm z-20">
        <div class="space-y-2">
          <div class="w-16 h-16 bg-indigo-600/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto border border-indigo-500/20 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </div>
          <h2 class="font-semibold text-xl text-white">Rejoindre le cours</h2>
          <p class="text-sm text-slate-400">Entrez votre code pour accéder au direct.</p>
        </div>

        <!-- Champ du Code Professeur -->
        <div class="space-y-3">
          <input type="password" id="room-code" placeholder="Code secret du cours" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-center text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 text-sm">
          
          <div class="grid grid-cols-2 gap-3">
            <button onclick="startMeeting('prof')" class="py-3 px-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/25 transition">
              👨‍🏫 Professeur
            </button>
            <button onclick="startMeeting('eleve')" class="py-3 px-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-bold text-xs rounded-xl border border-slate-700 transition">
              👀 Élève
            </button>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    let jitsiApi = null;

    function startMeeting(role) {
      const codeInput = document.getElementById("room-code").value.trim();
      
      if (!codeInput) {
        alert("Veuillez entrer le code secret du cours pour continuer.");
        return;
      }

      // Le code saisi devient le nom unique de la salle Jitsi
      const ROOM_NAME = "CoursLive_" + codeInput;
      
      document.getElementById("welcome-screen").classList.add("hidden");
      
      const isProf = (role === 'prof');
      document.getElementById("status-indicator").className = "w-3 h-3 rounded-full bg-red-500 animate-ping";
      document.getElementById("status-text").innerText = isProf ? "En Direct (Prof)" : "En Direct (Élève)";
      
      const toolbarButtons = isProf 
        ? ['microphone', 'camera', 'desktop', 'chat', 'participants', 'settings', 'hangup'] 
        : ['chat', 'raisehand', 'hangup'];

      const domain = "framatalk.org";
      const options = {
        roomName: ROOM_NAME,
        parentNode: document.querySelector('#jitsi-container'),
        userInfo: {
          displayName: isProf ? "Professeur" : "Élève"
        },
        configOverwrite: {
          prejoinPageEnabled: false,
          disableDeepLinking: true,
          startWithAudioMuted: !isProf,
          startWithVideoMuted: !isProf,
          toolbarButtons: toolbarButtons
        },
        interfaceConfigOverwrite: {
          SHOW_JITSI_WATERMARK: false,
          SHOW_BRAND_WATERMARK: false,
          SHOW_PROMOTIONAL_CLOSE_PAGE: false
        }
      };

      try {
        jitsiApi = new JitsiMeetExternalAPI(domain, options);
        
        // Si c'est le professeur, on lui attribue automatiquement le rôle de modérateur dès l'entrée dans le salon
        if (isProf) {
          jitsiApi.executeCommand('subject', 'Cours en Direct - Session Professeur');
        }

        jitsiApi.addListener('videoConferenceLeft', () => {
          closeMeeting();
        });
      } catch (error) {
        console.error("Erreur d'initialisation Jitsi:", error);
        alert("Impossible de charger la vidéo. Vérifiez vos bloqueurs de pubs.");
        closeMeeting();
      }
    }

    function closeMeeting() {
      if (jitsiApi) {
        jitsiApi.dispose();
        jitsiApi = null;
      }
      document.getElementById("welcome-screen").classList.remove("hidden");
      document.getElementById("status-indicator").className = "w-3 h-3 rounded-full bg-slate-600";
      document.getElementById("status-text").innerText = "Salle d'attente";
    }
  </script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
